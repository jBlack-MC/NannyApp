<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Nanny-App</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <style>
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f3f8fd;color:#0d1f33;font:16px/1.6 system-ui,sans-serif}
    .waves{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
    main{position:relative;text-align:center;max-width:32rem;padding:2rem 1.5rem}
    .logo{width:250px;max-width:70vw;height:250px;object-fit:contain;animation:float 3s ease-in-out infinite alternate}
    .dots{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:72px;height:12px}
    .dots span{width:8px;height:8px;border-radius:50%;background:#1e5f9e4d}
    .dots span:nth-child(2){width:10px;height:10px;background:#1e5f9e;animation:pulse .75s ease-in-out infinite alternate}
    #status{color:#5e7387;font-size:.9rem;min-height:1.6em}
    button{font:inherit;background:#1e5f9e;color:white;border:0;border-radius:12px;padding:.7rem 1.5rem;cursor:pointer}
    @keyframes float{from{transform:translateY(-5px) scale(.94)}to{transform:translateY(5px) scale(1.03)}}
    @keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.15)}}
    @media(prefers-reduced-motion:reduce){.logo,.dots span:nth-child(2){animation:none}}
  </style>
</head>
<body>
  <svg class="waves" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#d9efff" fill-opacity=".5" d="M0 0H70Q30 10 0 25Z M100 100H30Q70 90 100 75Z"/>
    <path fill="#d9efff" fill-opacity=".25" d="M0 0H40Q10 15 0 35Z M100 100H50Q85 85 100 65Z"/>
  </svg>
  <main>
    <img class="logo" src="/assets/Icon_Logo.png" alt="Nanny-App" width="250" height="250">
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p id="status" role="status">Opening your community…</p>
    <button id="retry" hidden>Try again</button>
    <noscript><p>Enable JavaScript to continue to Nanny-App.</p></noscript>
  </main>
  <script>
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    async function openApp() {
      const started = Date.now();
      retry.hidden = true;
      status.textContent = 'Opening your community…';
      try {
        const response = await fetch('/api/runtime-ready', {cache:'no-store', signal:AbortSignal.timeout(15000)});
        if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) throw new Error('Unavailable');
        const result = await response.json();
        if (result.runtime !== 'nannyapp-php') throw new Error('Unavailable');
        await new Promise(resolve => setTimeout(resolve, Math.max(0, 450 - (Date.now() - started))));
        window.location.replace('/index.php');
      } catch {
        status.textContent = 'Nanny-App is temporarily unavailable. Please try again shortly.';
        retry.hidden = false;
      }
    }
    retry.addEventListener('click', openApp);
    openApp();
  </script>
</body>
</html>
