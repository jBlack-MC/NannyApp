<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /srv/nannyapp/NannyApp.Web
    Alias /api/ /srv/nannyapp/NannyApp.Mobile/NannyApp/api/
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /srv/nannyapp>
        Require all denied
        Options -Indexes
    </Directory>
    <Directory /srv/nannyapp/NannyApp.Web>
        Require all granted
        AllowOverride All
    </Directory>
    <Directory /srv/nannyapp/NannyApp.Mobile/NannyApp/api>
        Require all granted
        AllowOverride None
        <FilesMatch "^_">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorDocument 404 /404.php
    ErrorDocument 500 /500.php
    ErrorLog /proc/self/fd/2
    # Do not log query strings containing account verification/reset tokens.
    LogFormat "%h %t \"%m %U %H\" %>s %b" privacy
    CustomLog /proc/self/fd/1 privacy
</VirtualHost>
