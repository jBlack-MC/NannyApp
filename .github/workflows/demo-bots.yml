name: Demo accounts

# Creates missing named demo accounts. Legacy bot cleanup requires a manual
# preview of user IDs and dependent records (see config/demo_bots.php).
on:
  workflow_dispatch:
    inputs:
      action:
        description: Create missing demo accounts
        required: true
        type: choice
        options:
          - add

permissions:
  contents: read

jobs:
  bots:
    name: Create demo accounts
    if: github.ref == 'refs/heads/main'
    environment: production-db
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Call the protected application endpoint
        env:
          APP_URL: ${{ vars.NANNYAPP_PRODUCTION_URL }}
          TOKEN: ${{ secrets.NANNYAPP_MIGRATION_TOKEN }}
          # Required: creates the five named demo accounts if missing.
          DEMO_PASSWORD: ${{ secrets.NANNYAPP_DEMO_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo 'Missing repository variable NANNYAPP_PRODUCTION_URL'; exit 1; }
          test -n "$TOKEN" || { echo 'Missing repository secret NANNYAPP_MIGRATION_TOKEN'; exit 1; }
          test -n "$DEMO_PASSWORD" || { echo 'Missing repository secret NANNYAPP_DEMO_PASSWORD'; exit 1; }
          body=$(jq -n --arg action "$ACTION" --arg pw "$DEMO_PASSWORD" '{action: $action, demoPassword: $pw}')
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            --request POST "$APP_URL/api/bots.php" \
            --header "X-Nanny-Migration-Token: $TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")
          echo "$response"
          echo "$response" | grep -F '"ok":true'
