name: Supabase database sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NannyApp.Shared/database/**'
      - 'NannyApp.Shared/config/migrations.php'
      - 'NannyApp.Shared/bin/migrate.php'
      - 'scripts/bootstrap_supabase.py'
      - 'scripts/requirements-supabase.txt'
      - '.github/workflows/supabase-migrate.yml'

permissions:
  contents: read

jobs:
  sync:
    name: Migrate, seed and verify Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate database settings
        env:
          DATABASE_URL: ${{ secrets.NANNYAPP_DB_URL }}
          APP_URL: ${{ vars.NANNYAPP_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo 'Missing secret NANNYAPP_DB_URL'; exit 1; }
          test -n "$APP_URL" || { echo 'Missing repository variable NANNYAPP_PRODUCTION_URL'; exit 1; }
          case "$APP_URL" in https://*) ;; *) echo 'NANNYAPP_PRODUCTION_URL must use HTTPS'; exit 1 ;; esac

      - uses: actions/checkout@v6

      - name: Install Supabase database client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-supabase.txt

      - name: Apply migrations and repair demo data
        env:
          NANNYAPP_DB_URL: ${{ secrets.NANNYAPP_DB_URL }}
          NANNYAPP_DB_SSLMODE: require
          NANNYAPP_DEMO_PASSWORD: ${{ secrets.NANNYAPP_DEMO_PASSWORD }}
        run: python3 scripts/bootstrap_supabase.py

      - name: Verify deployed API uses the same database
        env:
          APP_URL: ${{ vars.NANNYAPP_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          health=$(curl --fail-with-body --silent --show-error --retry 3 "$APP_URL/api/health.php")
          echo "$health"
          echo "$health" | grep -F '"status":"ok"'

      - name: Verify demo login through the deployed API
        env:
          APP_URL: ${{ vars.NANNYAPP_PRODUCTION_URL }}
          DEMO_PASSWORD: ${{ secrets.NANNYAPP_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEMO_PASSWORD" || { echo 'Missing secret NANNYAPP_DEMO_PASSWORD'; exit 1; }
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            --request POST "$APP_URL/api/auth/login.php" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"parent@nanny.app\",\"password\":\"$DEMO_PASSWORD\",\"rememberMe\":true}")
          echo "$response" | sed 's/"token":"[^"]*"/"token":"[redacted]"/'
          echo "$response" | grep -F '"success":true'
