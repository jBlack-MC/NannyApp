name: Supabase database sync

on:
  workflow_dispatch:
    inputs:
      seed_demo:
        description: Create missing demo accounts and sample data
        type: boolean
        default: false
      reset_demo_passwords:
        description: Rotate demo passwords and revoke sessions (requires seed_demo and DB URL)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nannyapp-production-database
  cancel-in-progress: false

jobs:
  sync:
    name: Migrate and verify Supabase
    if: github.ref == 'refs/heads/main'
    environment: production-db
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install database client
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-supabase.txt
      - name: Apply migrations and verify the deployed application
        env:
          APP_URL: ${{ vars.NANNYAPP_PRODUCTION_URL }}
          NANNYAPP_DB_URL: ${{ secrets.NANNYAPP_DB_URL }}
          NANNYAPP_DB_SSLMODE: require
          NANNYAPP_MIGRATION_TOKEN: ${{ secrets.NANNYAPP_MIGRATION_TOKEN }}
          NANNYAPP_DEMO_PASSWORD: ${{ secrets.NANNYAPP_DEMO_PASSWORD }}
          SEED_DEMO: ${{ inputs.seed_demo }}
          RESET_DEMO_PASSWORDS: ${{ inputs.reset_demo_passwords }}
        run: python3 scripts/deploy_database.py
