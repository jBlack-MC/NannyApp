name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NannyApp.Mobile/NannyApp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NANNYAPP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nannyapp-release.jks"

      - name: Build signed release APK
        env:
          RELEASE_API_URL: ${{ vars.NANNYAPP_RELEASE_API_URL || 'https://api.nannyapp.com/api/' }}
          NANNYAPP_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/nannyapp-release.jks
          NANNYAPP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NANNYAPP_RELEASE_KEYSTORE_PASSWORD }}
          NANNYAPP_RELEASE_KEY_ALIAS: ${{ secrets.NANNYAPP_RELEASE_KEY_ALIAS }}
          NANNYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.NANNYAPP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:validateReleaseApiUrl :app:assembleRelease -PNANNYAPP_RELEASE_API_URL="$RELEASE_API_URL"

      - name: Use stable release asset name
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NannyApp.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Nanny-App ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: NannyApp.Mobile/NannyApp/app/build/outputs/apk/release/NannyApp.apk
          fail_on_unmatched_files: true
