name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: PostgreSQL schema and five-account seed
    if: github.event.repository.private == false || vars.FREE_CI_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Test PostgreSQL migrations, access controls and shared web/API data
        run: python3 tests/docker-checks.py --postgres
      - name: Clean disposable PostgreSQL containers
        if: always()
        run: docker compose -p nannyapp-postgres-tests -f compose.postgres-test.yml down --volumes --remove-orphans
  security:
    name: PHP and synthetic security tests
    if: github.event.repository.private == false || vars.FREE_CI_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run isolated database, HTTP, mail, download and cache tests
        id: tests
        run: python3 tests/docker-checks.py
      - name: Clean disposable containers
        if: always()
        run: docker compose -p nannyapp-tests -f compose.test.yml down --volumes --remove-orphans
      - name: Summarize security checks
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          printf '## Synthetic security checks\n\nResult: %s\n\nSee the test step log for individual assertions.\n' "$TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
  android:
    name: Android build, unit tests and lint
    if: github.event.repository.private == false || vars.FREE_CI_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NannyApp.Mobile/NannyApp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Debug build, JVM regressions and lint
        id: debug
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify release URL is mandatory
        shell: bash
        run: |
          if ./gradlew --no-daemon :app:validateReleaseApiUrl > "$RUNNER_TEMP/release-url.log" 2>&1; then
            echo 'Release validation incorrectly accepted a missing URL'
            exit 1
          fi
          grep -F 'NANNYAPP_RELEASE_API_URL must be an absolute HTTPS API URL' "$RUNNER_TEMP/release-url.log"
      - name: Compile unsigned release with synthetic endpoint
        id: release
        run: ./gradlew --no-daemon :app:assembleRelease -PNANNYAPP_RELEASE_API_URL=https://ci.example.invalid/api/
      - name: Upload Android verification artifacts
        if: always() && (steps.debug.outcome == 'success' || steps.release.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            NannyApp.Mobile/NannyApp/app/build/outputs/apk/debug/app-debug.apk
            NannyApp.Mobile/NannyApp/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Summarize Android checks
        if: always()
        env:
          DEBUG_RESULT: ${{ steps.debug.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          printf '## Android checks\n\nDebug build, JVM tests and lint: %s\n\nUnsigned release: %s\n\nVerification APKs are attached to this workflow run. Signed APK publishing requires a manual dispatch from protected main.\n' "$DEBUG_RESULT" "$RELEASE_RESULT" >> "$GITHUB_STEP_SUMMARY"
  deliverables:
    name: Validate Task 2 deliverables
    if: github.event.repository.private == false || vars.FREE_CI_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check README links and credential hygiene
        run: python3 tests/check-readmes.py
      - name: Verify documentation catalogue
        run: |
          set -euo pipefail
          for file in docs/deliverables/*.html docs/deliverables/*.pdf; do test -s "$file"; done
          test "$(find docs/deliverables -maxdepth 1 -name '*.html' | wc -l)" -ge 7
          test "$(find docs/deliverables -maxdepth 1 -name '*.pdf' | wc -l)" -ge 7
          for file in docs/deliverables/*.pdf; do head -c 5 "$file" | grep -F '%PDF-' >/dev/null; done
      - name: Summarize deliverables
        run: printf '## Task 2 deliverables\n\nHTML and PDF project documents are present and valid.\n' >> "$GITHUB_STEP_SUMMARY"
# CI does not deploy or publish. Weekly checks use the same free-only gate.
